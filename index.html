<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fieldwatch | Wildlife Monitoring Console</title>
  <meta http-equiv="refresh" content="0; url=frontend/">
  <script>
    // Seamless instant redirect preserving query string and hash
    const destination = "frontend/" + window.location.search + window.location.hash;
    window.location.replace(destination);
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #020c09;
      color: #52ffae;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(82, 255, 174, 0.2);
      border-top-color: #52ffae;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 20px;f
      to { transform: rotate(360deg); }
    }
    p {
      font-size: 16px;
      letter-spacing: 0.5px;
      margin: 4px 0;
    }
    .hint {
      font-size: 13px;
      opacity: 0.7;
    }
    a {
      color: #52ffae;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Launching Fieldwatch Mission Console...</p>
  <p class="hint">If you are not redirected automatically, <a href="frontend/">click here to launch</a>.</p>
</body>
</html>
